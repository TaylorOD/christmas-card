<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Holidays 2025</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link rel="shortcut icon" type="image/png" href="../favicon.png" />

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #12324a;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
      max-height: 100vh;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <script>
    // 2025: a snow globe with a tiny village inside.
    // Click to shake it and stir up the snow.

    const W = 800;
    const H = 600;
    const CX = 400;
    const CY = 300;
    const R = 190;

    let flakes = [];
    let shake = 0;
    let glitter = [];
    let startTime;

    function setup() {
      createCanvas(W, H);
      textFont("Pacifico");
      startTime = millis();
      for (let i = 0; i < 260; i++) flakes.push(newFlake(true));
    }

    function newFlake(anywhere) {
      let a = random(TWO_PI);
      let d = sqrt(random()) * (R - 8);
      return {
        x: CX + cos(a) * d,
        y: anywhere ? CY + sin(a) * d : CY - R + 10,
        vx: 0,
        vy: random(0.3, 0.8),
        r: random(2, 4.5),
        settled: false
      };
    }

    function draw() {
      drawBackdrop();
      let jiggle = shake * 6 * sin(frameCount * 0.9);
      push();
      translate(jiggle, 0);
      drawGlow();
      drawGlobeInside();
      drawFlakes();
      drawGlitter();
      drawGlass();
      drawBase();
      pop();
      drawMessage();
      shake = max(0, shake - 0.015);
    }

    function drawBackdrop() {
      let ctx = drawingContext;
      let g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#0f2a40");
      g.addColorStop(1, "#244f6e");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      // tabletop
      noStroke();
      fill(70, 45, 35);
      rect(0, 540, W, 60);
      fill(0, 0, 0, 60);
      ellipse(CX, 548, 380, 26);
    }

    function drawGlow() {
      // warm light from the village spilling onto the table
      let ctx = drawingContext;
      let g = ctx.createRadialGradient(CX, CY + 60, 40, CX, CY + 60, R + 160);
      g.addColorStop(0, "rgba(255,210,140,0.22)");
      g.addColorStop(1, "rgba(255,210,140,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    function drawGlitter() {
      if (shake > 0.6 && frameCount % 2 === 0) {
        for (let i = 0; i < 6; i++) {
          let a = random(TWO_PI);
          let d = sqrt(random()) * (R - 20);
          glitter.push({ x: CX + cos(a) * d, y: CY + sin(a) * d, vx: random(-1, 1), vy: random(-1.5, 0.5), life: 255, hue: random() });
        }
      }
      noStroke();
      for (let i = glitter.length - 1; i >= 0; i--) {
        let g = glitter[i];
        g.vx *= 0.97;
        g.vy = g.vy * 0.97 + 0.015;
        g.x += g.vx;
        g.y += g.vy;
        g.life -= 1.6;
        let tw = 0.5 + 0.5 * sin(frameCount * 0.4 + i);
        if (g.hue < 0.5) fill(255, 220, 110, g.life * tw);
        else fill(255, 255, 255, g.life * tw);
        let r = 1.5 + tw * 2;
        rect(g.x - r / 2, g.y - r / 2, r, r);
        if (g.life <= 0 || dist(g.x, g.y, CX, CY) > R - 6) glitter.splice(i, 1);
      }
    }

    function drawBase() {
      noStroke();
      // wooden base with gold trim
      fill(105, 55, 32);
      quad(CX - 170, 540, CX + 170, 540, CX + 140, 478, CX - 140, 478);
      fill(85, 45, 26);
      quad(CX - 170, 540, CX + 170, 540, CX + 166, 530, CX - 166, 530);
      fill(212, 175, 90);
      rect(CX - 152, 468, 304, 6, 3);
      fill(130, 75, 45);
      rect(CX - 150, 472, 300, 14, 6);
      fill(212, 175, 90);
      rect(CX - 158, 524, 316, 5, 2);
      // little engraved snowflakes
      stroke(212, 175, 90, 180);
      strokeWeight(1.5);
      for (let sx of [CX - 110, CX + 110]) {
        for (let k = 0; k < 3; k++) {
          let a = k * PI / 3;
          line(sx - cos(a) * 9, 505 - sin(a) * 9, sx + cos(a) * 9, 505 + sin(a) * 9);
        }
      }
      noStroke();
      // brass plaque
      fill(170, 130, 55);
      rect(CX - 64, 494, 128, 26, 6);
      fill(240, 205, 115);
      rect(CX - 61, 497, 122, 20, 5);
      fill(95, 55, 30);
      textAlign(CENTER, CENTER);
      textSize(14);
      text("Happy 2025", CX, 506);
    }

    function drawGlobeInside() {
      let ctx = drawingContext;
      ctx.save();
      ctx.beginPath();
      ctx.arc(CX, CY, R, 0, TWO_PI);
      ctx.clip();

      // night sky inside the globe
      let g = ctx.createLinearGradient(0, CY - R, 0, CY + R);
      g.addColorStop(0, "#1b2f63");
      g.addColorStop(1, "#5d7cc0");
      ctx.fillStyle = g;
      ctx.fillRect(CX - R, CY - R, R * 2, R * 2);

      // moon and stars
      noStroke();
      fill(255, 250, 220);
      ellipse(CX + 95, CY - 110, 40);
      fill(255, 255, 230, 200);
      for (let i = 0; i < 25; i++) {
        let sx = CX - R + ((i * 97) % (2 * R));
        let sy = CY - R + ((i * 53) % 150);
        let tw = 2 + sin(frameCount * 0.07 + i);
        ellipse(sx, sy, tw);
      }

      // snowy ground
      fill(240, 246, 255);
      ellipse(CX, CY + 175, 460, 200);

      // tiny village
      drawHouse(CX - 110, CY + 80, 60, [180, 60, 50]);
      drawHouse(CX + 55, CY + 90, 54, [60, 110, 160]);
      drawChurch(CX - 20, CY + 70);
      drawPine(CX - 160, CY + 105, 0.7);
      drawPine(CX + 140, CY + 100, 0.8);
      drawPine(CX + 110, CY + 125, 0.55);
      drawSkater(CX - 40 + 50 * sin(frameCount * 0.02), CY + 140);

      // little pond
      fill(170, 205, 235);
      ellipse(CX - 30, CY + 150, 150, 26);
      drawSkater(CX - 30 + 55 * sin(frameCount * 0.02), CY + 146);

      ctx.restore();
    }

    function drawHouse(x, y, w, c) {
      noStroke();
      fill(c[0], c[1], c[2]);
      rect(x - w / 2, y - w * 0.6, w, w * 0.6);
      fill(80, 40, 35);
      triangle(x - w / 2 - 6, y - w * 0.6, x, y - w * 1.1, x + w / 2 + 6, y - w * 0.6);
      fill(250);
      triangle(x - w / 2 - 6, y - w * 0.6, x, y - w * 1.12, x - 4, y - w * 0.95);
      let cols = [[255, 90, 90], [255, 220, 90], [110, 200, 255], [120, 230, 140]];
      for (let i = 0; i <= 6; i++) {
        let t = i / 6;
        let lx = lerp(x - w / 2 - 4, x + w / 2 + 4, t);
        let ly = y - w * 0.6 + 3 + sin(t * PI) * 3;
        let c = cols[(i + floor(frameCount / 20)) % 4];
        fill(c[0], c[1], c[2], 60);
        ellipse(lx, ly, 9);
        fill(c[0], c[1], c[2]);
        ellipse(lx, ly, 3.5);
      }
      let glow = 200 + 40 * noise(x, frameCount * 0.05);
      fill(255, glow, 110);
      rect(x - w * 0.3, y - w * 0.42, w * 0.2, w * 0.18);
      rect(x + w * 0.1, y - w * 0.42, w * 0.2, w * 0.18);
    }

    function drawChurch(x, y) {
      fill(235, 225, 210);
      rect(x - 22, y - 50, 44, 50);
      rect(x - 9, y - 90, 18, 40);
      fill(70, 50, 60);
      triangle(x - 26, y - 50, x, y - 76, x + 26, y - 50);
      triangle(x - 12, y - 90, x, y - 118, x + 12, y - 90);
      fill(255, 220, 120);
      ellipse(x, y - 30, 14, 18);
      ellipse(x, y - 70, 8);
    }

    function drawPine(x, y, s) {
      fill(30, 100, 60);
      for (let i = 0; i < 3; i++) {
        let w = (56 - i * 14) * s;
        let top = y - (30 + i * 24) * s;
        triangle(x, top - 22 * s, x - w / 2, top + 22 * s, x + w / 2, top + 22 * s);
      }
      fill(250);
      triangle(x, y - 104 * s, x - 7 * s, y - 92 * s, x + 7 * s, y - 92 * s);
    }

    function drawSkater(x, y) {
      fill(200, 40, 50);
      ellipse(x, y - 14, 8, 12);
      fill(250, 220, 190);
      ellipse(x, y - 23, 7);
      stroke(40);
      strokeWeight(1.5);
      line(x - 2, y - 8, x - 4, y);
      line(x + 2, y - 8, x + 4, y);
      noStroke();
    }

    function drawFlakes() {
      noStroke();
      fill(255, 255, 255, 235);
      for (let f of flakes) {
        if (shake > 0.05) {
          f.settled = false;
          f.vx += random(-0.6, 0.6) * shake;
          f.vy += random(-1.2, 0.4) * shake;
        }
        if (!f.settled) {
          f.vx *= 0.96;
          f.vy = f.vy * 0.96 + 0.02;
          f.vy = min(f.vy, 0.9);
          f.x += f.vx + sin(frameCount * 0.02 + f.r) * 0.2;
          f.y += f.vy;
        }
        // keep inside the globe
        let dx = f.x - CX;
        let dy = f.y - CY;
        let d = sqrt(dx * dx + dy * dy);
        if (d > R - 6) {
          f.x = CX + (dx / d) * (R - 6);
          f.y = CY + (dy / d) * (R - 6);
          f.vx *= -0.3;
          f.vy *= -0.3;
        }
        // settle on the snowy ground
        let groundY = CY + 175 - 100 * sqrt(max(0, 1 - sq((f.x - CX) / 230)));
        if (f.y >= groundY) {
          f.y = groundY;
          f.settled = true;
        }
        ellipse(f.x, f.y, f.r);
      }
      // slowly recycle settled flakes so it keeps snowing
      for (let i = 0; i < 2; i++) {
        let k = floor(random(flakes.length));
        if (flakes[k].settled) flakes[k] = newFlake(false);
      }
    }

    function drawGlass() {
      noFill();
      stroke(220, 240, 255, 140);
      strokeWeight(4);
      ellipse(CX, CY, R * 2);
      // highlights
      stroke(255, 255, 255, 90);
      strokeWeight(10);
      arc(CX, CY, R * 2 - 30, R * 2 - 30, PI + 0.5, PI + 1.3);
      strokeWeight(5);
      arc(CX, CY, R * 2 - 30, R * 2 - 30, PI + 1.5, PI + 1.7);
      noStroke();
    }

    function drawMessage() {
      let t = (millis() - startTime) / 1000;
      let a = constrain(map(t, 0.3, 2, 0, 255), 0, 255);
      textAlign(CENTER, CENTER);
      textSize(36);
      fill(0, 0, 0, a * 0.4);
      text("Happy Holidays from Taylor Dorsett!", W / 2 + 2, 52);
      fill(255, 248, 230, a);
      text("Happy Holidays from Taylor Dorsett!", W / 2, 50);
      textSize(16);
      textFont("sans-serif");
      fill(200, 225, 245, a * (0.5 + 0.5 * sin(frameCount * 0.05)));
      text("click to shake", W / 2, 578);
      textFont("Pacifico");
    }

    function mousePressed() {
      shake = 1;
    }
  </script>
</body>

</html>
