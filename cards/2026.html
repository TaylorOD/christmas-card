<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Holidays 2026</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link rel="shortcut icon" type="image/png" href="../favicon.png" />

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b1026;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
      max-height: 100vh;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <script>
    // 2026: a snowy night at the cabin.
    // Click anywhere to drop a burst of extra snow.

    let stars = [];
    let flakes = [];
    let smoke = [];
    let pines = [];
    let startTime;

    const W = 800;
    const H = 600;
    const BULB_COLORS = [
      [255, 70, 70],
      [70, 200, 90],
      [255, 210, 60],
      [80, 150, 255]
    ];

    function setup() {
      createCanvas(W, H);
      textFont("Pacifico");
      startTime = millis();

      for (let i = 0; i < 140; i++) {
        stars.push({ x: random(W), y: random(H * 0.6), r: random(1, 2.6), phase: random(TWO_PI) });
      }
      for (let i = 0; i < 220; i++) {
        flakes.push(makeFlake(random(H)));
      }
      // Pine trees on the hills: x, base y, size
      pines = [
        { x: 70, y: 470, s: 1.1 }, { x: 130, y: 455, s: 0.8 }, { x: 610, y: 470, s: 1.2 },
        { x: 680, y: 455, s: 0.9 }, { x: 740, y: 475, s: 1.0 }, { x: 560, y: 480, s: 0.7 }
      ];
    }

    function makeFlake(y) {
      return { x: random(W), y: y, r: random(2, 6), speed: random(0.6, 1.8), drift: random(1000) };
    }

    function draw() {
      drawSky();
      drawStars();
      drawMoon(700, 250);
      drawAurora();
      drawHills();
      for (let p of pines) drawPine(p.x, p.y, p.s);
      drawCabin(300, 380);
      drawSnowman(235, 535);
      drawSmoke();
      drawSnow();
      drawGarland();
      drawMessage();
    }

    function drawSky() {
      let ctx = drawingContext;
      let g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#0b1026");
      g.addColorStop(0.6, "#2b3a74");
      g.addColorStop(1, "#5a6fb0");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    function drawStars() {
      noStroke();
      for (let s of stars) {
        let a = 150 + 105 * sin(frameCount * 0.05 + s.phase);
        fill(255, 255, 230, a);
        ellipse(s.x, s.y, s.r, s.r);
      }
    }

    function drawMoon(x, y) {
      noStroke();
      for (let i = 4; i > 0; i--) {
        fill(255, 250, 220, 18);
        ellipse(x, y, 70 + i * 22);
      }
      fill(255, 250, 225);
      ellipse(x, y, 70);
      fill(230, 225, 200);
      ellipse(x - 12, y - 8, 12);
      ellipse(x + 14, y + 10, 9);
      ellipse(x + 6, y - 16, 6);
    }

    function drawAurora() {
      noFill();
      for (let band = 0; band < 3; band++) {
        stroke(120, 255, 190, 28 - band * 6);
        strokeWeight(26 - band * 6);
        beginShape();
        for (let x = -20; x <= W + 20; x += 20) {
          let y = 150 + band * 22 + 40 * noise(x * 0.004, band, frameCount * 0.004) - 20;
          curveVertex(x, y);
        }
        endShape();
      }
      noStroke();
    }

    function drawHills() {
      noStroke();
      fill(215, 228, 245);
      beginShape();
      vertex(0, H);
      for (let x = 0; x <= W; x += 10) vertex(x, 450 + 25 * sin(x * 0.008 + 1));
      vertex(W, H);
      endShape(CLOSE);

      fill(245, 250, 255);
      beginShape();
      vertex(0, H);
      for (let x = 0; x <= W; x += 10) vertex(x, 495 + 18 * sin(x * 0.012));
      vertex(W, H);
      endShape(CLOSE);
    }

    function drawPine(x, y, s) {
      noStroke();
      fill(90, 55, 30);
      rect(x - 5 * s, y - 10 * s, 10 * s, 18 * s);
      fill(20, 90, 60);
      for (let i = 0; i < 3; i++) {
        let w = (60 - i * 14) * s;
        let top = y - (40 + i * 28) * s;
        triangle(x, top - 20 * s, x - w / 2, top + 30 * s, x + w / 2, top + 30 * s);
      }
      // snow caps
      fill(245, 250, 255);
      triangle(x, y - 116 * s, x - 9 * s, y - 100 * s, x + 9 * s, y - 100 * s);
    }

    function drawCabin(x, y) {
      // chimney
      noStroke();
      fill(120, 60, 45);
      rect(x + 120, y - 95, 22, 50);

      // walls
      fill(140, 82, 45);
      rect(x, y, 200, 110);
      stroke(105, 60, 30);
      strokeWeight(2);
      for (let ly = y + 14; ly < y + 110; ly += 14) line(x, ly, x + 200, ly);
      noStroke();

      // roof with snow
      fill(95, 45, 35);
      triangle(x - 20, y + 4, x + 100, y - 80, x + 220, y + 4);
      fill(250, 252, 255);
      beginShape();
      vertex(x - 24, y + 6);
      vertex(x + 100, y - 86);
      vertex(x + 224, y + 6);
      vertex(x + 210, y + 12);
      vertex(x + 100, y - 68);
      vertex(x - 10, y + 12);
      endShape(CLOSE);
      rect(x + 117, y - 101, 28, 9, 4); // snow on chimney

      // glowing windows
      let flicker = 210 + 30 * noise(frameCount * 0.05);
      drawWindow(x + 25, y + 30, flicker);
      drawWindow(x + 135, y + 30, flicker);

      // door + wreath
      fill(85, 45, 25);
      rect(x + 82, y + 48, 36, 62, 4, 4, 0, 0);
      noFill();
      stroke(30, 120, 60);
      strokeWeight(6);
      ellipse(x + 100, y + 66, 20);
      noStroke();
      fill(220, 40, 40);
      ellipse(x + 100, y + 76, 7);
      fill(255, 215, 0);
      ellipse(x + 110, y + 82, 5);
    }

    function drawWindow(x, y, glow) {
      noStroke();
      fill(255, 200, 90, 40);
      ellipse(x + 20, y + 18, 80);
      fill(255, glow, 110);
      rect(x, y, 40, 36);
      stroke(85, 45, 25);
      strokeWeight(3);
      line(x + 20, y, x + 20, y + 36);
      line(x, y + 18, x + 40, y + 18);
      noFill();
      rect(x, y, 40, 36);
      noStroke();
    }

    function drawSmoke() {
      if (frameCount % 8 === 0) {
        smoke.push({ x: 431, y: 280, r: 10, a: 140, seed: random(100) });
      }
      noStroke();
      for (let i = smoke.length - 1; i >= 0; i--) {
        let p = smoke[i];
        p.y -= 0.7;
        p.x += 0.3 + (noise(p.seed, frameCount * 0.01) - 0.5);
        p.r += 0.25;
        p.a -= 0.9;
        fill(220, 225, 235, p.a);
        ellipse(p.x, p.y, p.r);
        if (p.a <= 0) smoke.splice(i, 1);
      }
    }

    function drawSnowman(x, y) {
      stroke(170, 185, 210);
      strokeWeight(1.5);
      fill(255);
      ellipse(x, y, 60);
      ellipse(x, y - 45, 44);
      ellipse(x, y - 80, 32);
      noStroke();

      // scarf
      fill(200, 30, 40);
      rect(x - 18, y - 68, 36, 7, 3);
      rect(x + 6, y - 66, 7, 22, 3);

      // hat
      fill(30);
      rect(x - 18, y - 98, 36, 5);
      rect(x - 11, y - 120, 22, 22);
      fill(60, 160, 90);
      rect(x - 11, y - 104, 22, 4);

      // face
      fill(20);
      ellipse(x - 6, y - 84, 4);
      ellipse(x + 6, y - 84, 4);
      fill(255, 140, 0);
      triangle(x, y - 80, x, y - 76, x + 14, y - 77);

      // arms (one waving)
      stroke(110, 70, 35);
      strokeWeight(3);
      line(x - 20, y - 48, x - 48, y - 62);
      let wave = sin(frameCount * 0.08) * 10;
      line(x + 20, y - 48, x + 44, y - 72 + wave);
      noStroke();
    }

    function drawSnow() {
      noStroke();
      fill(255, 255, 255, 220);
      for (let i = flakes.length - 1; i >= 0; i--) {
        let f = flakes[i];
        f.y += f.speed;
        f.x += sin(frameCount * 0.02 + f.drift) * 0.5;
        ellipse(f.x, f.y, f.r);
        if (f.y > H + 10) {
          if (flakes.length > 220) flakes.splice(i, 1);
          else Object.assign(f, makeFlake(-10));
        }
      }
    }

    function drawGarland() {
      // A string of lights swagging across the top of the card
      stroke(30, 60, 40);
      strokeWeight(2);
      noFill();
      let swags = 4;
      let sw = W / swags;
      for (let s = 0; s < swags; s++) {
        beginShape();
        for (let t = 0; t <= 1.001; t += 0.05) {
          vertex(s * sw + t * sw, 8 + 30 * sin(PI * t));
        }
        endShape();
      }
      noStroke();
      let n = 0;
      for (let s = 0; s < swags; s++) {
        for (let t = 0.1; t < 1; t += 0.2) {
          let bx = s * sw + t * sw;
          let by = 8 + 30 * sin(PI * t) + 8;
          let c = BULB_COLORS[n % BULB_COLORS.length];
          let on = (floor(frameCount / 30) + n) % 3 !== 0;
          fill(c[0], c[1], c[2], on ? 70 : 0);
          ellipse(bx, by, 22);
          fill(on ? color(c[0], c[1], c[2]) : color(c[0] * 0.4, c[1] * 0.4, c[2] * 0.4));
          ellipse(bx, by, 9, 13);
          n++;
        }
      }
    }

    function drawMessage() {
      let t = (millis() - startTime) / 1000;
      let a = constrain(map(t, 0.5, 2.5, 0, 255), 0, 255);
      let bob = sin(frameCount * 0.04) * 3;

      textAlign(CENTER, CENTER);
      noStroke();
      textSize(40);
      fill(0, 0, 0, a * 0.4);
      text("Happy Holidays from Taylor Dorsett!", W / 2 + 2, 92 + bob + 2);
      fill(255, 245, 220, a);
      text("Happy Holidays from Taylor Dorsett!", W / 2, 92 + bob);

      textSize(26);
      fill(255, 215, 90, a);
      text("Cheers to 2026 & a bright 2027", W / 2, 140 + bob);
    }

    function mousePressed() {
      for (let i = 0; i < 60; i++) {
        let f = makeFlake(mouseY + random(-30, 30));
        f.x = mouseX + random(-40, 40);
        flakes.push(f);
      }
    }
  </script>
</body>

</html>
