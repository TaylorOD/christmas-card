<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Holiday Cards</title>
  <meta name="description" content="Holiday cards from Taylor Dorsett. Each year, the best AI model available makes the card.">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="shortcut icon" type="image/png" href="favicon.png" />

  <style>
    :root {
      --night: #1a1012;
      --pine: #0f2a22;
      --cream: #fbf1df;
      --muted: #d8c6ab;
      --gold: #f2c46d;
      --red: #c8323c;
      --green: #2e7d55;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--night);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--cream);
      font-family: "Inter", system-ui, sans-serif;
      display: flex;
      justify-content: center;
      padding: 56px 16px 40px;
      position: relative;
      overflow-x: hidden;
      /* warm firelight glow at the bottom, deep pine night at the top */
      background:
        radial-gradient(ellipse 90% 55% at 50% 108%, rgba(255, 150, 70, 0.30), transparent 70%),
        radial-gradient(ellipse 60% 40% at 12% 30%, rgba(200, 50, 60, 0.16), transparent 70%),
        radial-gradient(ellipse 60% 45% at 90% 60%, rgba(46, 125, 85, 0.18), transparent 70%),
        linear-gradient(180deg, #0c1f1a 0%, #1a1418 55%, #2a1612 100%);
      background-attachment: fixed;
    }

    /* soft, blurry fairy lights in the background */
    .bokeh {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bokeh span {
      position: absolute;
      border-radius: 50%;
      filter: blur(6px);
      opacity: 0.35;
      animation: glow 6s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { opacity: 0.18; transform: scale(0.92); }
      50% { opacity: 0.5; transform: scale(1.05); }
    }

    /* falling snow */
    #snow {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* a string of lights draped across the top of the page */
    .garland {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 46px;
      pointer-events: none;
      z-index: 3;
    }

    .garland svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .bulb {
      animation: twinkle 2.4s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    main {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    h1 {
      font-family: "Pacifico", cursive;
      font-weight: normal;
      font-size: clamp(36px, 7vw, 56px);
      margin: 0;
      color: var(--cream);
      text-align: center;
      line-height: 1.2;
      text-shadow: 0 0 24px rgba(242, 196, 109, 0.45), 0 2px 0 rgba(0, 0, 0, 0.35);
    }

    .intro {
      margin: -6px 0 0;
      max-width: 560px;
      text-align: center;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.55;
    }

    .years {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .years button {
      font: inherit;
      font-weight: 500;
      font-size: 15px;
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid rgba(251, 241, 223, 0.25);
      background: rgba(251, 241, 223, 0.06);
      color: var(--cream);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }

    .years button:hover {
      border-color: var(--gold);
      background: rgba(242, 196, 109, 0.12);
    }

    .years button[aria-pressed="true"] {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
      box-shadow: 0 0 18px rgba(200, 50, 60, 0.55);
    }

    .years button:focus-visible {
      outline: 3px solid rgba(242, 196, 109, 0.6);
      outline-offset: 2px;
    }

    .frame {
      width: 100%;
      max-width: 812px;
      aspect-ratio: 4 / 3;
      border-radius: 14px;
      overflow: hidden;
      background: #111;
      border: 6px solid var(--cream);
      box-shadow:
        0 0 0 1px rgba(242, 196, 109, 0.4),
        0 0 60px rgba(255, 170, 90, 0.18),
        0 18px 40px rgba(0, 0, 0, 0.5);
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .credit {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
      text-align: center;
      min-height: 1.4em;
    }

    footer {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.8;
    }

    footer a {
      color: var(--gold);
      text-decoration: none;
      border-bottom: 1px solid rgba(242, 196, 109, 0.4);
    }

    footer a:hover {
      border-bottom-color: var(--gold);
    }

    footer .source {
      display: block;
      font-size: 12px;
      opacity: 0.8;
    }

    @media (prefers-reduced-motion: reduce) {
      .bokeh span,
      .bulb {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="bokeh" id="bokeh" aria-hidden="true"></div>
  <canvas id="snow" aria-hidden="true"></canvas>
  <div class="garland" aria-hidden="true">
    <svg id="garland" preserveAspectRatio="none"></svg>
  </div>

  <main>
    <h1>Happy Holidays!</h1>
    <p class="intro">
      Every year, the best AI model available makes a holiday card.
      Pick a year to see how far they've come.
    </p>

    <ul class="years" id="years" aria-label="Choose a year"></ul>

    <div class="frame">
      <iframe id="card" title="Holiday card" scrolling="no"></iframe>
    </div>

    <p class="credit" id="credit"></p>

    <footer>
      a <a href="https://www.taylordorsett.com/">taylor dorsett</a> production
      <span class="source"><a href="https://github.com/TaylorOD/christmas-card">source on GitHub</a></span>
    </footer>
  </main>

  <script>
    // To add a new year: create cards/<year>.html and add an entry here (newest first).
    const CARDS = [
      { year: 2026, credit: "Made using the best model available in 2026." },
      { year: 2025, credit: "Made using the best model available in 2025." },
      { year: 2024, credit: "Made using the best model available in 2024." },
      { year: 2023, credit: "Made using the best model available in 2023." }
    ];

    const list = document.getElementById("years");
    const frame = document.getElementById("card");
    const credit = document.getElementById("credit");
    const buttons = {};

    for (const c of CARDS) {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = c.year;
      btn.addEventListener("click", () => show(c.year));
      li.appendChild(btn);
      list.appendChild(li);
      buttons[c.year] = btn;
    }

    function show(year) {
      const card = CARDS.find(c => c.year === year) || CARDS[0];
      for (const y in buttons) buttons[y].setAttribute("aria-pressed", String(Number(y) === card.year));
      frame.src = "cards/" + card.year + ".html";
      credit.textContent = card.credit;
      history.replaceState(null, "", "#" + card.year);
    }

    window.addEventListener("hashchange", () => show(Number(location.hash.slice(1))));
    show(Number(location.hash.slice(1)));

    // ---------- cozy background ----------

    const BULBS = ["#ff5a5f", "#f2c46d", "#5fb4ff", "#4fd18b", "#ff8fd0"];
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // Blurry fairy lights scattered behind everything.
    const bokeh = document.getElementById("bokeh");
    for (let i = 0; i < 26; i++) {
      const s = document.createElement("span");
      const size = 10 + Math.random() * 34;
      s.style.width = s.style.height = size + "px";
      s.style.left = Math.random() * 100 + "%";
      s.style.top = Math.random() * 100 + "%";
      s.style.background = BULBS[i % BULBS.length];
      s.style.animationDelay = (-Math.random() * 6) + "s";
      s.style.animationDuration = (4 + Math.random() * 5) + "s";
      bokeh.appendChild(s);
    }

    // The garland: a drooping wire with glowing bulbs, redrawn to fit the width.
    function drawGarland() {
      const svg = document.getElementById("garland");
      const w = window.innerWidth;
      const h = 46;
      const swag = Math.max(160, Math.min(260, w / 5));
      const n = Math.ceil(w / swag);
      const step = w / n;
      let path = "M 0 4";
      let bulbs = "";
      let k = 0;
      for (let i = 0; i < n; i++) {
        const x0 = i * step;
        path += ` Q ${x0 + step / 2} 34 ${x0 + step} 4`;
        for (let t = 0.12; t < 1; t += 0.19) {
          const bx = x0 + t * step;
          const by = 4 + 2 * (1 - t) * t * 30 + 1;
          const c = BULBS[k % BULBS.length];
          const delay = ((k * 0.37) % 2.4).toFixed(2);
          bulbs += `<g class="bulb" style="animation-delay:-${delay}s">` +
            `<circle cx="${bx}" cy="${by + 9}" r="9" fill="${c}" opacity="0.28"/>` +
            `<rect x="${bx - 2.5}" y="${by - 1}" width="5" height="4" rx="1" fill="#3b4a3e"/>` +
            `<ellipse cx="${bx}" cy="${by + 8}" rx="4.2" ry="6" fill="${c}"/>` +
            `<ellipse cx="${bx - 1.3}" cy="${by + 6}" rx="1.2" ry="2" fill="#fff" opacity="0.6"/></g>`;
          k++;
        }
      }
      svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
      svg.innerHTML = `<path d="${path}" fill="none" stroke="#1f3a2c" stroke-width="2.5"/>` + bulbs;
    }
    drawGarland();
    window.addEventListener("resize", drawGarland);

    // Gentle snowfall over the whole page.
    const snow = document.getElementById("snow");
    const ctx = snow.getContext("2d");
    let flakes = [];

    function sizeSnow() {
      const dpr = window.devicePixelRatio || 1;
      snow.width = window.innerWidth * dpr;
      snow.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.round(Math.min(140, window.innerWidth / 9));
      flakes = Array.from({ length: count }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: 0.8 + Math.random() * 2.4,
        v: 0.3 + Math.random() * 0.8,
        d: Math.random() * 1000
      }));
    }

    function tick(t) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
      for (const f of flakes) {
        if (!reduceMotion) {
          f.y += f.v;
          f.x += Math.sin(t / 1600 + f.d) * 0.3;
          if (f.y > h + 4) { f.y = -4; f.x = Math.random() * w; }
        }
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
      }
      if (!reduceMotion) requestAnimationFrame(tick);
    }

    sizeSnow();
    window.addEventListener("resize", () => {
      sizeSnow();
      if (reduceMotion) tick(0);
    });
    requestAnimationFrame(tick);
  </script>
</body>

</html>
