<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Holidays from Taylor Dorsett</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <link rel="shortcut icon" type="image/png" href="favicon.png" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 16px;
      box-sizing: border-box;
      background: #f4efe6;
      font-family: system-ui, sans-serif;
      color: #2b2b2b;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    h1 {
      font-family: "Pacifico", cursive;
      font-weight: normal;
      font-size: 28px;
      margin: 0;
      color: #b3202a;
    }

    label {
      font-size: 16px;
    }

    select {
      font-size: 16px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #999;
      background: white;
    }

    iframe {
      width: 100%;
      max-width: 802px;
      aspect-ratio: 802 / 602;
      border: 0;
    }
  </style>
</head>

<body>
  <header>
    <h1>Holiday Cards</h1>
    <label for="year">Year:</label>
    <select id="year"></select>
  </header>

  <iframe id="card" title="Holiday card"></iframe>

  <script>
    // To add a new year: drop cards/<year>.html in place and add the year here.
    const YEARS = [2026, 2023];

    const select = document.getElementById("year");
    const frame = document.getElementById("card");

    for (const y of YEARS) {
      const opt = document.createElement("option");
      opt.value = y;
      opt.textContent = y;
      select.appendChild(opt);
    }

    function show(year) {
      if (!YEARS.includes(year)) year = YEARS[0];
      select.value = year;
      frame.src = "cards/" + year + ".html";
      history.replaceState(null, "", "#" + year);
    }

    select.addEventListener("change", () => show(Number(select.value)));
    window.addEventListener("hashchange", () => show(Number(location.hash.slice(1))));
    show(Number(location.hash.slice(1)));
  </script>
</body>

</html>
